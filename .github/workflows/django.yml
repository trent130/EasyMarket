name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    env:
      # Tests use SQLite and never contact external payment services.
      # This value is intentionally ephemeral and must not be reused in deployments.
      SECRET_KEY: ci-only-not-for-deployment
      # The test client uses HTTP. Keep production's SSL redirect disabled here
      # so endpoint tests exercise application responses rather than redirects.
      DEBUG: "True"

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r test-requirements.txt
    - name: Audit Dependencies
      run: |
        pip-audit --no-deps --disable-pip -r requirements.txt -r test-requirements.txt
    - name: Run Tests
      run: |
        python -m pytest
